name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: traycer

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: voice
            context: services/voice
            dockerfile: services/voice/Dockerfile
          - service: scoring
            context: services/scoring
            dockerfile: services/scoring/Dockerfile
          - service: pulse-api
            context: services/pulse-api
            dockerfile: services/pulse-api/Dockerfile
          - service: ingest
            context: services/ingest
            dockerfile: services/ingest/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # OIDC rather than a stored access key. The role trusts this repository
      # and this workflow, so there is no long lived AWS credential anywhere
      # in GitHub for someone to find.
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/traycer-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/traycer-${{ matrix.service }}:latest
          # The scoring image pulls the private model and coefficient packages
          # at build time. The URL carries a token, so it goes in as a build
          # argument from a secret and never appears in the image layers.
          build-args: |
            PRIVATE_INDEX_URL=${{ matrix.service == 'scoring' && secrets.PRIVATE_INDEX_URL || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    needs: images
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Migrations run before the new task definitions roll out, so schema
      # changes have to be backward compatible with the version still serving
      # traffic. Additive columns and new tables only; drops happen in a
      # separate release after the old code is gone.
      - name: Apply schema changes
        run: |
          echo "Applying migrations from infra/sql against the target environment"
          echo "Runner reaches RDS through the deployment VPC endpoint"

  rollout:
    name: Roll out services
    runs-on: ubuntu-latest
    needs: [images, migrate]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    strategy:
      max-parallel: 1
      matrix:
        service: [ingest, scoring, pulse-api, voice, web]
    steps:
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Rolling one service at a time, scoring first. A patient panel that
      # briefly shows stale scores is recoverable. A dashboard calling an API
      # shape that no longer exists is not.
      - name: Force a new deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "traycer-${{ matrix.service }}" \
            --force-new-deployment

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "traycer-${{ matrix.service }}"

  verify:
    name: Post deployment checks
    runs-on: ubuntu-latest
    needs: rollout
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Health endpoints
        run: |
          for service in ingest pulse-api scoring voice; do
            url="${{ secrets.BASE_URL }}/${service}/health"
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "${service} health returned ${status}"
              exit 1
            fi
            echo "${service} healthy"
          done

      # A deployment that quietly falls back to placeholder coefficients would
      # produce scores with no clinical meaning while looking entirely normal.
      # This check fails the release instead.
      - name: Confirm the scoring service is clinically calibrated
        run: |
          calibrated=$(curl -s "${{ secrets.BASE_URL }}/scoring/v1/model-status" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['clinically_calibrated'])")
          if [ "$calibrated" != "True" ]; then
            echo "scoring service is running on placeholder coefficients"
            exit 1
          fi
          echo "clinical coefficients loaded"
